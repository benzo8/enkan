# enkan default configuration
# This file lives in the enkan package folder and is the lowest-priority fallback
# in the config discovery chain (app folder).
# Override by placing enkan.toml in your start folder or %APPDATA%\enkan\.

[slideshow]
navigation_basis = "branch"  # default navigation basis: 'folder' or 'branch'

[cache]
background_preload = true # whether to preload images in the background
preload_queue_length = 5  # number of images to preload in the background
cache_size = 10           # number of loaded media items to keep in the LRU cache
history_queue_length = 25 # number of history entries to keep
